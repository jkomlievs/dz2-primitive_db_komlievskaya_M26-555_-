[project]
name = "primitive-db"
version = "0.1.0"
description = "Примитивная база данных — консольное приложение"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prettytable>=3.0.0",
    "prompt>=0.4.1",
]

[project.scripts]
project = "primitive_db.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/primitive_db"]
[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
